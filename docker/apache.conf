<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/library/src

    <Directory /var/www/library/src>
        Options -Indexes
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteRule ^(?:app|views|bin|tests|router\.php)(?:/|$) - [F,NC]
        RewriteRule ^assets/[A-Za-z0-9._-]+$ - [L]
        RewriteRule ^index\.php$ - [END]
        RewriteRule ^$ index.php [END]
    </Directory>

    <Directory /var/www/library/src/app>
        Require all denied
    </Directory>
    <Directory /var/www/library/src/views>
        Require all denied
    </Directory>
</VirtualHost>
